# Rogator 配置模板（提交仓库）
# 本地配置：config/config.toml（gitignore，首次启动从 template 复制）
# 运行时加载策略：以本模板为底，用户 config.toml 只覆盖已写出的键（不写回磁盘）。
# 升级后请对照本模板自行更新 config.toml；版本不一致时启动日志会提醒，不会自动改文件。

[server]
version = "2.2.2"
port = 8932
host = "0.0.0.0"
prelogin = 32
# 预登录/换号连续登录之间的间隔（秒），避免短时间内大量 signin
login_interval = 15.0
# 启动时若端口被占用，尝试终止占用进程（Windows 需足够权限）
startup_force_kill_port = true

[retry]
# 换号 / 上游超时重试次数（不含首次尝试）
max_retry_on_error = 3

[limits]
max_concurrent = 32
max_queue_size = 512
# /v1/models 等 API 对外声明的上下文长度
model_context_length = 256000
# true：绝不截断 prompt、不上传超长前缀附件，整段直发上游（413 时也不自动降限重试）
send_full_prompt = false
# aiohttp 入站 POST body 上限（默认 1 MiB 会导致 Claude CLI 长会话 413）
client_max_body_bytes = 3355443200

[timeout]
create_chat = 15.0

[models]
# 后台定时从上游拉取模型列表的间隔（秒）；0 表示仅启动/prelogin 时刷新
refresh_interval = 3600.0

[upstream]
# 启用的上游模块（对应 upstream/<name>/）；未列出的不会被加载
# 例: enabled = ["qwen", "zen", "deepseek"]
enabled = ["qwen", "ollama"]

[shutdown]
# 关机时等待在途流式/请求结束的最长时间（秒），超时后强制 cancel
wait_active_requests = 3.0
# main 中 state.shutdown() 的上限（秒）
total_timeout = 8.0
# finally 整段清理（HTTP stop、cleanup、cancel tasks）的硬性上限；超时 os._exit
hard_exit_timeout = 25.0

[fncall]
# record_all 总开关：true 全开，false 全关（下方单项在此开关下不生效）
record_all = false
# record_prompt / print_prompt 任一为 true 时写入 logs/prompts/{req_id}.txt
record_prompt = false
print_prompt = false
# record_response = true 时写入 logs/responses/{req_id}.txt（上游 thinking+answer，不经 entml 解析）
record_response = false
# record_sse = true 时实时写入 logs/sse/{req_id}.sse（上游 SSE 原始字节流，parse 前）
record_sse = false

[debug]
level = "INFO"
color = true
log_to_file = true
log_name = "rogator"
# HTTP 访问日志（aiohttp access log）；false 关闭
access_log = true
