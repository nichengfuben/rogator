# Cursor 上游配置（复制到 configs/cursor.toml 后按需修改）

[capabilities]
chat = true
vision = false
search = false
count_tokens = false
image_gen = false
tts = false

[cursor]
base_url = "https://agentn.global.api5.cursor.sh"
client_version = "cli-2026.07.23-e383d2b"
default_model = "composer-2.5-fast"
request_timeout = 300
heartbeat_interval = 5
timezone = "Asia/Shanghai"

# 自建 Token 拉取服务（拉号 / 用量监测）；base_url 与 api_keys 须自行填写
[token_service]
base_url = ""
api_keys = []
# Key 日限额切换线：≤100 视为占 daily_limit 的百分比；无 daily_limit 时不因本地计数误杀
switch_threshold = 80
usage_threshold = 90.0
poll_interval = 30
status_refresh_interval = 30
request_timeout = 15
max_retry_per_pull = 3

[models]
default = "default"
fallback = [
    "default",
    "composer-2.5-fast",
    "composer-2.5",
    "composer-2",
    "composer-2-fast",
    "composer-1.5",
    "gpt-4",
    "gpt-4o",
    "gpt-4o-mini",
    "gpt-4-turbo",
    "gpt-3.5-turbo",
]

[models.mapping]
gpt-4 = "composer-2.5-fast"
gpt-4o = "composer-2.5-fast"
gpt-4o-mini = "composer-2.5-fast"
gpt-4-turbo = "composer-2.5"
gpt-3.5-turbo = "composer-2"
